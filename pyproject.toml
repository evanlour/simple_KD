[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_kd"
version = "0.0.1"
description = "A modular PyTorch toolkit for Knowledge Distillation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "accelerate>=0.20.0",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.0.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simple_kd*"]
exclude = ["tests*", "examples*"]
