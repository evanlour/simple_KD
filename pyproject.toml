[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_kd"
version = "0.0.2"
description = "A modular PyTorch toolkit for Knowledge Distillation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Evangelos Lourmpakis", email= "evanlourb@gmail.com"}]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "accelerate>=0.20.0",
    "opencv-python>=4.0,<5.0",
    "pyarrow>=22.0",
    "scikit-learn>=1.7",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simple_kd*"]
exclude = ["tests*", "examples*"]
